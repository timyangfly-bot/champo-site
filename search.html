function performSearch() {
  const searchInput = document.getElementById('searchInput').value.toLowerCase();
  const categoryFilter = document.getElementById('categoryFilter').value;
  
  document.getElementById('searchLoading').style.display = 'block';
  document.getElementById('searchResults').innerHTML = '';
  
  // Simulate loading delay
  setTimeout(() => {
    const results = allProducts.filter(product => {
      // Text search
      const searchText = searchInput.trim();
      if (searchText) {
        const inName = product.name.toLowerCase().includes(searchText);
        const inDesc = product.description.toLowerCase().includes(searchText);
        const inFeatures = product.features.some(f => f.toLowerCase().includes(searchText));
        const inCategory = product.category_name.toLowerCase().includes(searchText);
        if (!(inName || inDesc || inFeatures || inCategory)) {
          return false;
        }
      }
      
      // Category filter
      if (categoryFilter && product.category_slug !== categoryFilter) {
        return false;
      }
      
      return true;
    });
    
    displayResults(results);
    document.getElementById('searchLoading').style.display = 'none';
  }, 300);
}

function displayResults(results) {
  const resultsContainer = document.getElementById('searchResults');
  
  if (results.length === 0) {
    resultsContainer.innerHTML = `
      <div class="no-results">
        <h3>No products found</h3>
        <p>Try different keywords or browse by category</p>
      </div>
    `;
    return;
  }
  
  let html = `<div class="search-count">Found ${results.length} product${results.length !== 1 ? 's' : ''}</div>`;
  html += '<div class="products-grid">';
  
  results.forEach(product => {
    html += `
      <div class="product-card">
        <div class="product-images">
          ${product.images.main ? `<img src="${product.images.main}" alt="${product.name}" class="product-main-image">` : ''}
        </div>
        <div class="product-info">
          <h3>${product.name}</h3>
          <p>${product.description}</p>
          <div class="product-features">
            ${product.features.map(f => `<span class="product-feature">${f}</span>`).join('')}
          </div>
          <div style="margin-top: 15px;">
            <a class="btn" href="../${product.category_slug}/" style="display:inline-block;padding:8px 16px;font-size:14px">View Category</a>
          </div>
        </div>
      </div>
    `;
  });
  
  html += '</div>';
  resultsContainer.innerHTML = html;
}

// Initialize search on page load
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('searchInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      performSearch();
    }
  });
  
  // Perform initial search if URL has query parameter
  const urlParams = new URLSearchParams(window.location.search);
  const query = urlParams.get('q');
  if (query) {
    document.getElementById('searchInput').value = query;
    performSearch();
  }
});
</script>
